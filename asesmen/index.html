<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asesmen DTBS</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Mencegah scroll ganda */
            background-color: #f4f7f6;
        }
        .layar-penuh {
            position: absolute;
            /* Trik rahasia: Menggeser layar ke atas sejauh 35px untuk memotong banner Google */
            top: -35px; 
            left: 0;
            width: 100%;
            height: calc(100% + 35px); /* Menambah tinggi agar bawahnya tidak ngatung */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="layar-penuh">
        <iframe src="https://script.google.com/macros/s/AKfycbzaPcZBauc04hWNlLf4P9VtqP6jTXlzAQNWw5VrwaGSKIHYCw9ol8FWNJ0gzIZbYpBkZQ/exec"></iframe>
    </div>

</body>
</html>
